# 杭博门业经营分析系统 —— nginx 反代配置
#
# 部署位置：宿主机 /etc/nginx/conf.d/door_analysis.conf（或容器内 nginx 的 conf.d）
# 前置条件：web 容器已把 staticfiles / media 挂到宿主机目录，nginx 直接读盘，
#          这样静态请求不进 Django，报表页的 JS/CSS 与上传图片由 nginx 零开销返回。

upstream door_analysis_web {
    # 对应 docker-compose 中的 web 服务；若 nginx 跑在宿主机而非同一网络，
    # 把这里换成 127.0.0.1:8000 即可。
    server web:8000;
    keepalive 16;
}

# gzip 在 http/server 上下文均可声明；放这里便于整份配置自包含。
# 只压缩文本类资源：图片/字体本身已压缩，再压纯属浪费 CPU。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

server {
    listen 80;
    server_name _;

    # 上传门体照片/图纸的场景较多，放宽请求体上限，避免大图被 413 拦截
    client_max_body_size 20m;

    # 编码与超时：经营看板存在较重的聚合查询，代理读超时留足余量
    charset utf-8;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # ---------------------------------------------------------------------
    # 安全响应头
    # ---------------------------------------------------------------------
    # 禁止被第三方站点 iframe 嵌套，防点击劫持（经营数据页面尤其敏感）
    add_header X-Frame-Options "DENY" always;
    # 禁止浏览器按内容嗅探 MIME 类型，避免上传文件被当作脚本执行
    add_header X-Content-Type-Options "nosniff" always;
    # 跨站跳转时不泄露完整来源路径（客户编号可能出现在 URL 里）
    add_header Referrer-Policy "same-origin" always;
    # 关闭不需要的浏览器能力，降低 XSS 被利用后的影响面
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------------------------------------------------------------------
    # 静态文件：由 Django collectstatic 产出，nginx 直出
    # ---------------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        # 文件名带 hash（CompressedManifestStaticFilesStorage），可放心长缓存
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 上传目录禁止执行任何脚本，防止图片目录被当作脚本入口
        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    # ---------------------------------------------------------------------
    # 应用请求：交给 gunicorn
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://door_analysis_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 与 settings 中的 SECURE_PROXY_SSL_HEADER 对应：让 Django 知道原始协议，
        # 否则开启 SECURE_SSL_REDIRECT 后会出现无限重定向。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    # 健康检查端点不写访问日志，避免心跳刷满日志文件
    location = /healthz {
        access_log off;
        proxy_pass http://door_analysis_web/;
    }
}
