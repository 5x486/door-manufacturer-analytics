[pytest]
; ============================================================================
; 杭博门业经营分析系统 · pytest 配置（改进版，项目根已有同名文件时以本份覆盖）
; ----------------------------------------------------------------------------
; 测试统一走 config.settings.test（SQLite 内存库 + MD5 哈希），
; 保证 CI 与本地行为一致，也不依赖本机 MySQL 是否启动。
; ============================================================================
DJANGO_SETTINGS_MODULE = config.settings.test

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; -q         输出聚焦失败项，不刷一屏点号
; --tb=short 保留足够定位问题的堆栈，去掉框架内部的噪声帧
; --strict-markers 拼错的 marker 直接报错，而不是悄悄按「无标记」执行
; --disable-warnings 汇总告警而不逐条打印，告警的去留交给下面的 filterwarnings 决定
; -p no:cacheprovider 不在只读挂载或容器里写 .pytest_cache，避免无意义的报错
addopts = -q --tb=short --strict-markers --disable-warnings -p no:cacheprovider

markers =
    slow: 运行较慢的用例（模型训练、大批量导入等），本地默认跳过，CI 全量执行
    integration: 依赖真实外部资源（MySQL / Redis / 文件）的集成用例，需显式选择运行

; ----------------------------------------------------------------------------
; 告警过滤
; mysqlclient 在部分版本上会通过 Django 适配层抛出与 Python 版本相关的
; DeprecationWarning，属上游问题，与本项目代码无关；不在这里忽略会淹没真实告警。
; 其余告警保持默认展示，新依赖引入的弃用告警应当在测试阶段就暴露。
; ----------------------------------------------------------------------------
filterwarnings =
    ignore::DeprecationWarning:MySQLdb.*
    ignore::DeprecationWarning:django.db.backends.mysql.*
    ignore::DeprecationWarning:mysqlclient.*
    ignore:.*mysqlclient.*:DeprecationWarning
    default::DeprecationWarning

; 测试产物统一落 artifacts，失败后便于取证
junit_family = xunit2
